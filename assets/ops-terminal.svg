<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Yazeed system profile terminal</title>
  <desc id="desc">A dark pixel-inspired terminal card summarizing Yazeed's engineering focus.</desc>
  <rect width="1200" height="270" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="268" rx="13" fill="none" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="42" rx="13" fill="#161b22"/>
  <rect x="1" y="29" width="1198" height="14" fill="#161b22"/>
  <circle cx="25" cy="21" r="6" fill="#e6463a"/>
  <circle cx="47" cy="21" r="6" fill="#484f58"/>
  <circle cx="69" cy="21" r="6" fill="#484f58"/>
  <text x="92" y="27" fill="#8b949e" font-family="monospace" font-size="15">yazeed@system: ~/profile</text>
  <text x="30" y="82" fill="#e6463a" font-family="monospace" font-size="18">$</text>
  <text x="55" y="82" fill="#f0f6fc" font-family="monospace" font-size="18">whoami</text>
  <text x="55" y="114" fill="#c9d1d9" font-family="monospace" font-size="17">Yazeed // Systems Engineer &amp; Full-Stack Builder</text>
  <text x="30" y="157" fill="#e6463a" font-family="monospace" font-size="18">&gt;</text>
  <text x="55" y="157" fill="#8b949e" font-family="monospace" font-size="17">FOCUS</text>
  <text x="145" y="157" fill="#f0f6fc" font-family="monospace" font-size="17">Automation • AI Products • Production Infrastructure</text>
  <text x="30" y="196" fill="#e6463a" font-family="monospace" font-size="18">&gt;</text>
  <text x="55" y="196" fill="#8b949e" font-family="monospace" font-size="17">STACK</text>
  <text x="145" y="196" fill="#f0f6fc" font-family="monospace" font-size="17">TypeScript • JavaScript • Python • Node.js • Next.js</text>
  <text x="30" y="235" fill="#e6463a" font-family="monospace" font-size="18">&gt;</text>
  <text x="55" y="235" fill="#8b949e" font-family="monospace" font-size="17">STATUS</text>
  <text x="145" y="235" fill="#e6463a" font-family="monospace" font-size="17">SYSTEMS ONLINE</text>
  <rect x="329" y="221" width="10" height="18" fill="#e6463a">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
